<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>PVZ ROGUELIKE</title>
        <style>
html, body, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
}

body {
    color: white;
    background-color: black;
    overflow: hidden;
    touch-action: none;
}

#canvas {
    display: block;
}

#canvas:focus {
    outline: none;
}

#status, #status-splash, #status-progress {
    position: absolute;
    left: 0;
    right: 0;
}

#status, #status-splash {
    top: 0;
    bottom: 0;
}

#status {
    background-color: #242424;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
}

#status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}

#status-splash.show-image--false {
    display: none;
}

#status-splash.fullsize--true {
    height: 100%;
    width: 100%;
    object-fit: contain;
}

#status-splash.use-filter--false {
    image-rendering: pixelated;
}

#status-progress, #status-notice {
    display: none;
}

#status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
}

#status-notice {
    background-color: #5b3943;
    border-radius: 0.5rem;
    border: 1px solid #9b3943;
    color: #e0e0e0;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem;
    text-align: center;
    z-index: 1;
}
        </style>
        <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
        <link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="index.png" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <script src="index.js"></script>
        <script>
// Merged .pck size used for progress reporting (sum of all parts)
const PCK_TOTAL_SIZE = 164346604;

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":PCK_TOTAL_SIZE,"index.wasm":36160334},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
    const statusOverlay = document.getElementById('status');
    const statusProgress = document.getElementById('status-progress');
    const statusNotice = document.getElementById('status-notice');

    let initializing = true;
    let statusMode = '';

    function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
            return;
        }
        if (mode === 'hidden') {
            statusOverlay.remove();
            initializing = false;
            return;
        }
        statusOverlay.style.visibility = 'visible';
        statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
        statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        statusMode = mode;
    }

    function setStatusNotice(text) {
        while (statusNotice.lastChild) {
            statusNotice.removeChild(statusNotice.lastChild);
        }
        const lines = text.split('\n');
        lines.forEach((line) => {
            statusNotice.appendChild(document.createTextNode(line));
            statusNotice.appendChild(document.createElement('br'));
        });
    }

    function displayFailureNotice(err) {
        console.error(err);
        if (err instanceof Error) {
            setStatusNotice(err.message);
        } else if (typeof err === 'string') {
            setStatusNotice(err);
        } else {
            setStatusNotice('An unknown error occurred.');
        }
        setStatusMode('notice');
        initializing = false;
    }

    // Stream files sequentially into a single pre-allocated continuous memory segment
    async function mergePckParts(onProgress) {
        const partUrls = [
            'index.pck.part1',
            'index.pck.part2',
            'index.pck.part3',
        ];

        // Pre-allocate the entire exact final size into RAM immediately 
        // to avoid resizing or data duplication cycles
        const mergedArray = new Uint8Array(PCK_TOTAL_SIZE);
        let totalBytesLoaded = 0;

        // Process each part file in a strict linear pipeline sequence
        for (let i = 0; i < partUrls.length; i++) {
            const response = await fetch(partUrls[i]);
            if (!response.ok) {
                throw new Error(`Failed to fetch ${partUrls[i]} (${response.status})`);
            }

            const reader = response.body.getReader();
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // Directly insert streaming fragments straight into the pre-allocated index position
                mergedArray.set(value, totalBytesLoaded);
                totalBytesLoaded += value.byteLength;

                // Send progress callback upstream safely
                onProgress(totalBytesLoaded, PCK_TOTAL_SIZE);
            }
        }

        const blob = new Blob([mergedArray], { type: 'application/octet-stream' });
        return URL.createObjectURL(blob);
    }

    const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
        if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
            let serviceWorkerRegistrationPromise;
            try {
                serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
            } catch (err) {
                serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
            }
            Promise.race([
                serviceWorkerRegistrationPromise.then((registration) => {
                    if (registration != null) {
                        return Promise.reject(new Error('Service worker already exists.'));
                    }
                    return registration;
                }).then(() => engine.installServiceWorker()),
                new Promise((resolve) => {
                    setTimeout(() => resolve(), 2000);
                }),
            ]).then(() => {
                window.location.reload();
            }).catch((err) => {
                console.error('Error while registering service worker:', err);
            });
        } else {
            const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
            displayFailureNotice(missingMsg + missing.join('\n'));
        }
    } else {
        setStatusMode('progress');

        mergePckParts((loaded, total) => {
            statusProgress.value = loaded;
            statusProgress.max = total;
        }).then((mergedPckUrl) => {
            const originalFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                const url = (typeof input === 'string') ? input
                    : (input instanceof Request ? input.url : String(input));
                if (url.endsWith('index.pck')) {
                    return originalFetch(mergedPckUrl, init);
                }
                return originalFetch(input, init);
            };

            engine.startGame({
                'onProgress': function (current, total) {
                    if (current > 0 && total > 0) {
                        statusProgress.value = current;
                        statusProgress.max = total;
                    } else {
                        statusProgress.removeAttribute('value');
                        statusProgress.removeAttribute('max');
                    }
                },
            }).then(() => {
                window.fetch = originalFetch; // restore original fetch
                URL.revokeObjectURL(mergedPckUrl); // free blob memory immediately
                setStatusMode('hidden');
            }, displayFailureNotice);
        }).catch(displayFailureNotice);
    }
}());
        </script>
    </body>
</html>
